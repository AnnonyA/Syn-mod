name: Build experimental saveinstance

on:
  push:
    paths:
      - modifications.patch
      - patches/**
      - bench/**
      - tests/**
      - scripts/**
      - .github/workflows/build-saveinstance.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Syn-mod
        uses: actions/checkout@v4

      - name: Fetch pinned UniversalSynSaveInstance upstream
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            "https://raw.githubusercontent.com/luau/UniversalSynSaveInstance/3ba234b586868f8ca2a0000f93e5709e57d3699d/saveinstance.luau" \
            --output saveinstance.luau

          actual_sha="$(git hash-object saveinstance.luau)"
          expected_sha="0daa88270abdfec6a345d4505b551be7efe41d89"

          if [ "$actual_sha" != "$expected_sha" ]; then
            echo "Unexpected upstream blob: $actual_sha" >&2
            exit 1
          fi

      - name: Apply Syn-mod patch set
        shell: bash
        run: |
          set -euo pipefail
          git apply --check modifications.patch
          git apply modifications.patch
          git apply --check patches/recovery-v2.patch
          git apply patches/recovery-v2.patch
          for patch in patches/performance-compat-v1/*.patch; do
            git apply --check "$patch"
            git apply "$patch"
          done

      - name: Run regression checks
        shell: bash
        run: |
          set -euo pipefail
          python tests/test_mod_features.py
          python tests/test_performance_compat.py
          python scripts/verify_build.py

      - name: Build pinned Luau compiler
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/luau-lang/luau.git /tmp/luau
          git -C /tmp/luau checkout --quiet 46d5dbaa17865e0c97da1f14b3e35ad7b6bfcb37
          cmake -S /tmp/luau -B /tmp/luau/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DLUAU_BUILD_CLI=ON \
            -DLUAU_BUILD_TESTS=OFF
          cmake --build /tmp/luau/build --target Luau.Compile.CLI --parallel 2

      - name: Compile generated Luau
        shell: bash
        run: |
          set -euo pipefail
          compiler="$(find /tmp/luau/build -type f -name 'luau-compile' -perm -111 | head -n 1)"
          if [ -z "$compiler" ]; then
            echo "luau-compile was not produced" >&2
            exit 1
          fi
          "$compiler" saveinstance.luau >/dev/null
          "$compiler" bench/compare.luau >/dev/null

      - name: Commit generated build
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add saveinstance.luau

          if git diff --cached --quiet; then
            echo "Generated saveinstance.luau is already up to date."
            exit 0
          fi

          git commit -m "build: generate experimental saveinstance"
          git push
